name: CI

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
  merge_group:

jobs:
  # ── Nix build & checks (primary CI path, mirrors cuddle) ──────────────────
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            substituters = https://cache.iog.io https://cache.nixos.org/

      - name: Build (nix build)
        run: nix build --show-trace

      - name: Run checks (pre-commit hooks, haddock, sdist)
        run: nix flake check --show-trace

  # ── Cabal matrix — multi-GHC coverage ─────────────────────────────────────
  cabal:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ghc:
          - "8.10"
          - "9.0"
          - "9.2"
          - "9.4"
          - "9.6"
          - "9.8"
          - "9.10"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        id: setup-haskell
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: latest
          cabal-update: true

      - name: Configure and generate plan.json
        run: |
          cabal configure --enable-tests --disable-documentation
          cabal build --dry-run

      - name: Restore cached build artifacts
        uses: actions/cache@v3
        with:
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          key: ${{ runner.os }}-${{ steps.setup-haskell.outputs.ghc-version }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.setup-haskell.outputs.ghc-version }}-

      - name: Build
        run: cabal build all

      - name: Haddock
        run: cabal haddock all

      - name: Sdist
        run: cabal sdist all

  # ── Stack build ────────────────────────────────────────────────────────────
  stack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Haskell (Stack)
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest

      - name: Restore cached Stack artifacts
        uses: actions/cache@v3
        with:
          path: ~/.stack
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml', 'stack.yaml.lock') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: Build (Stack)
        run: stack build --system-ghc

      - name: Test (Stack)
        run: stack test --system-ghc
